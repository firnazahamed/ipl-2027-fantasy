# Summer is Coming scoring and lineup rules, as used in the 2026 app.
# 2027 uses these unchanged (decided Nov 24, 2026). A league vote becomes an edit here.
season = 2026

[batting]
run = 1
pace_per_run_over_balls = 1          # + (runs - balls)
four = 1
six = 2
duck = -5                            # out for 0
duck_exempt = ["not out", "DNB", "absent hurt"]
milestone_step = 25
milestones = [0, 10, 20, 30, 50]     # 0-24, 25-49, 50-74, 75-99, 100+

[bowling]
wicket = 25
dot = 1.5
maiden = 30
tight_econ = 9.0                     # econ < 9: 3 x (1.5 x balls - runs)
tight_mult = 3.0
tight_runs_per_ball = 1.5
loose_econ = 12.0                    # 9 <= econ <= 12: 0 ; econ > 12: 2 x balls - runs
loose_runs_per_ball = 2.0
milestones = [0, 0, 10, 20, 30, 50]  # 0, 1, 2, 3, 4, 5+ wickets

[fielding]
catch = 10
stumping = 10
run_out = 10                         # each fielder named

[bonus]
player_of_match = 25
winning_team = 5                     # every player in the winning XI

[lineup]
xi_size = 11
bench_size = 4
captain_mult = 1.5                   # rounded up
vice_captain_mult = 1.2              # rounded up
sub_mult = 0.5                       # bench player subbed in for the week
max_overseas = 4
min_batters = 6
min_bowlers = 5
min_wicketkeepers = 1
